# Required checks for merging into main (see ios_kernels/CLAUDE.md). Do not modify.
name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: ios_kernels

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  kernel-tree:
    name: kernel tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run utils/check_kernel_tree.py

  no-shell-scripts:
    name: no shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run utils/check_no_shell_scripts.py

  forbidden-markers:
    name: forbidden markers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv run utils/check_forbidden_markers.py --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  pytest:
    name: pytest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest
