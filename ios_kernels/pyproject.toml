[project]
name = "ios-kernels"
version = "0.1.0"
description = "Hand-written Metal LLM kernels plus Python surfaces (OpenAI-compatible server, CLI chat) for manual testing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "transformers>=4.45",   # tokenizer + chat template only (no torch needed)
    "jinja2>=3.1",          # required by transformers for chat templates
    "openai>=1.40",         # CLI client
]

[project.optional-dependencies]
# Weight conversion, correctness reference, and baselines (benchmarking/).
bench = ["torch>=2.4", "safetensors>=0.4", "numpy>=1.26", "gguf>=0.10", "sentencepiece>=0.2", "mlx-lm>=0.20"]
# In-process MLX backend for the server (--runner mlx).
mlx = ["mlx-lm>=0.20"]

[project.scripts]
openai-server = "surfaces.openai_server.server:main"
cli-chat = "surfaces.cli_client.chat:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surfaces"]

[tool.pytest.ini_options]
testpaths = ["surfaces/tests"]
